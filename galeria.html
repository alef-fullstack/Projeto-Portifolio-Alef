<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projetos - Dev Alef</title>
    <link rel="stylesheet" href="style-galeria.css">
</head>

<body>

    <header>
        <h1 class="projects">Meu Projetos</h1>
        <a href="index.html" class="btn-voltar"><button class="button-voltar">⬅ Voltar para o Inicio</button></a>
    </header>

    <main class="container-galeria">

        <section class="secao-albuns" id="secao-albuns">

            <div class="grid-albuns">

                <div class="card-album" data-album="projeto1">
                    <img src="./assets/img-projets/project-generator-ia/Desktop.png" alt="Capa do Álbum 1">
                    <div class="album-info">
                        <h3>Gerador IA</h3>
                        <p>2 fotos</p>
                    </div>
                </div>

                <div class="card-album" data-album="projeto2">
                    <img src="./assets/img-projets/projet-convert-currency/desktop.png" alt="Capa do Álbum 2">
                    <div class="album-info">
                        <h3>Conversor de moedas</h3>
                        <p>2 fotos</p>
                    </div>
                </div>

                <div class="card-album" data-album="projeto3">
                    <img src="./assets/img-projets/project-joken-po/desktop.png" alt="Capa do Álbum 3">
                    <div class="album-info">
                        <h3>Joken pô!</h3>
                        <p>2 fotos</p>
                    </div>
                </div>

                <div class="card-album" data-album="projeto4">
                    <img src="./assets/img-projets/project-we-care/monitor.png" alt="Capa do Álbum 4">
                    <div class="album-info">
                        <h3>We Care</h3>
                        <p>2 fotos</p>
                    </div>
                </div>

                <div class="card-album" data-album="projeto5">
                    <img src="./assets/img-projets/project-wide-coverage-location/desktop.png" alt="Capa do Álbum 5">
                    <div class="album-info">
                        <h3>Wide Coverage Location</h3>
                        <p>2 fotos</p>
                    </div>
                </div>


                <div class="card-album" data-album="projeto6">
                    <img src="./assets/img-projets/project-easy-shopping/desktop.png" alt="Capa do Álbum 6">
                    <div class="album-info">
                        <h3>Easy Shopping</h3>
                        <p>2 fotos</p>
                    </div>
                </div>

            </div>
        </section>
        <section class="secao-fotos hidden" id="secao-fotos">
            <div class="topo-fotos">
                <button id="btn-voltar-albuns">⬅ Voltar para os Álbuns</button>
                <h2>Fotos do album: <span id="nome-album-ativo"></span>"</h2>
            </div>
            <div class="grid-fotos" id="grid-fotos-dinamico"></div>
        </section>

    </main>

    <div id="foto-modal" class="modal hidden">
        <span id="btn-fechar-modal">&times;</span>
        <img id="foto-ampliada" src="" alt="Foto Ampliada">
    </div>

</body>
<script src="./galeria.js"></script>

</html>
