<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Álbuns de Fotos</title>
    <link rel="stylesheet" href="style-galeria.css">
</head>
<body>

    <header>
        <h1 class="projects">Meu Projetos</h1>
        <a href="index.html" class="btn-voltar"><button class="button-voltar">⬅ Voltar para o Inicio</button></a>
    </header>

    <main class="container-galeria">
        
        <section class="secao-albuns">

            <div class="grid-albuns">
                
                <div class="card-album">
                    <img src="https://picsum.photos/300/200?random=1" alt="Capa do Álbum 1">
                    <div class="album-info">
                        <h3>Projeto 1</h3>
                        <p>12 fotos</p>
                    </div>
                </div>

                 <div class="card-album">
                    <img src="https://picsum.photos/300/200?random=1" alt="Capa do Álbum 1">
                    <div class="album-info">
                        <h3>Projeto 2</h3>
                        <p>12 fotos</p>
                    </div>
                </div>

                 <div class="card-album">
                    <img src="https://picsum.photos/300/200?random=1" alt="Capa do Álbum 1">
                    <div class="album-info">
                        <h3>Projeto 3</h3>
                        <p>12 fotos</p>
                    </div>
                </div>

                <div class="card-album">
                    <img src="https://picsum.photos/300/200?random=2" alt="Capa do Álbum 2">
                    <div class="album-info">
                        <h3>Projeto 4</h3>
                        <p>8 fotos</p>
                    </div>
                </div>

                <div class="card-album">
                    <img src="https://picsum.photos/300/200?random=3" alt="Capa do Álbum 3">
                    <div class="album-info">
                        <h3>Projeto 5</h3>
                        <p>24 fotos</p>
                    </div>
                </div>

            </div>
        </section>

        <hr> <section class="secao-fotos">
            <h2>Fotos do Álbum: <span id="nome-album-ativo">Projeto 1</span></h2>
            <div class="grid-fotos">
                <div class="foto-item"><img src="https://picsum.photos/400/400?random=11" alt="Foto 1"></div>
                <div class="foto-item"><img src="https://picsum.photos/400/400?random=12" alt="Foto 2"></div>
                <div class="foto-item"><img src="https://picsum.photos/400/400?random=13" alt="Foto 3"></div>
                <div class="foto-item"><img src="https://picsum.photos/400/400?random=14" alt="Foto 4"></div>
            </div>
        </section>

    </main>

</body>
</html>
